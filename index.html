<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chickens</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/assets/favicons/site.webmanifest">
    <style>
        @font-face {
            font-family: 'DepartureMono';
            src: url('assets/fonts/DepartureMono-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            margin: 0;
            padding: clamp(8px, 2vw, 24px);
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            font-family: 'DepartureMono', monospace;
        }
        .gameView {
            position: relative;
            width: min(100%, 1200px, max(280px, calc((100svh - 150px) * 1.6)));
            aspect-ratio: 2 / 1;
            border: 1px solid #000000;
            background-color: #deebff;
            overflow: hidden;
        }
        .gameStage {
            position: absolute;
            width: 800px;
            height: 400px;
            transform-origin: top left;
        }
        #gameCanvas {
            display: block;
            width: 800px;
            height: 400px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 24px;
            margin-top: 16px;
            font-size: clamp(12px, 1vw, 16px);
            color: #333;
            font-family: sans-serif;
        }
        .controls p { margin: 0; }
    </style>
</head>
<body>
    <div class="gameView">
        <div class="gameStage">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>
    </div>
    <div class="controls">
        <p>Use <strong>Arrow keys</strong> to move</p>
        <p>Press <strong>Spacebar</strong> to jump, hold to glide</p>
        <p>Press <strong>V</strong> to cluck</p>
        <p>Press <strong>T</strong> to chat</p>
    </div>
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
